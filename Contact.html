<!DOCTYPE html>

<html lang="en">

<head>
    <title>Contact Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="myStyles.css">

    <script>
        function validateForm(){
            var name = document.getElementById("name_input").value;
            var email = document.getElementById("email_input").value;
            var contact_number = document.getElementById("contact_number_input").value;
            var comment = document.getElementById("comment_input").value;
            
            if (name == "" || email == "" || contact_number == "" || comment == ""){
                alert("All inputs are Mandatory, please amend your entries and try again.");
            }
            else {
                document.getElementById("Contact_Form").submit(); //Sends the email
            }
        }
    </script>
</head>

<body>
    <!-- Title Section -->
    <section class="title_section">
        <h1 class="page_title">Nextgen Hardware</h1>
        <img src="ShopLogo.png" alt="Logo Image" class="Logo_Image">
    </section>

    <!-- Menu -->
    <!-- Menu Section -->
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark" id="Page_NavBar">
        <div class="container-fluid">
            <!-- Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Links -->
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="Index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Contact.html">Contact</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Page Content Section -->
    <section id="contact_form_section">
        <form id="Contact_Form">
            <label for="Full_Name" class="Contact_Form_Label" id="name_label">Full Name</label>
            <br>
            <input type="text" name="Full_Name" placeholder="Your Full Name..." id="name_input">

            <br>

            <label for="Email" class="Contact_Form_Label">Email</label>
            <br>
            <input type="email" name="Email" placeholder="Your Email Address..." id="email_input">

            <br>

            <label for="Contact_Number" class="Contact_Form_Label">Contact Number</label>
            <br>
            <input type="text" name="Contact_Number" placeholder="Your Contact Number..." id="contact_number_input">

            <br>

            <label for="Comment" class="Contact_Form_Label">Comment</label>
            <br>
            <input type="text" name="Comment" placeholder="Write Your Comment Here..." id="comment_input">

            <br>

            <button type="button" onclick="validateForm()" id="contact_form_button">Send</button>
        </form>
    </section>
    <!-- Footer Section -->
    <section class="footer_section"> &copy; 2026 - NextgenHardware</section>
</body>

</html>
